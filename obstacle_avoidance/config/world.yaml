world_sim:
  ros__parameters:
    world_width: 10.0
    world_height: 10.0
    # x, y, radius triples
    obstacles: [3.0, 3.0, 0.5,  7.0, 7.0, 0.7,  6.5, 2.5, 0.4,  2.5, 7.5, 0.6,  5.0, 8.5, 0.3]
    # x1, y1, x2, y2 quadruples (the outer boundary is added automatically)
    walls: [4.5, 5.0, 8.0, 5.0,  1.5, 5.0, 3.0, 5.0]
    start_x: 1.0
    start_y: 1.0
    start_theta: 0.8
    robot_radius: 0.2
    scan_beams: 180
    range_max: 6.0
    range_noise_std: 0.01

avoider:
  ros__parameters:
    cruise_speed: 0.5
    turn_speed: 1.2
    stop_distance: 0.6
    clear_distance: 0.9
    front_half_angle_deg: 25.0
    side_angle_deg: 80.0
    steer_gain: 0.4
